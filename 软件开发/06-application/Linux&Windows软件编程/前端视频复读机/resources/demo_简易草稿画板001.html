<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易矢量草稿画板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { overflow: hidden; background: #f5f5f5; display: flex; flex-direction: column; height: 100vh; }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #222;
            color: #fff;
            flex-wrap: wrap;
            align-items: center;
        }
        .tool-group { display: flex; gap: 6px; align-items: center; padding: 0 8px; border-right: 1px solid #555; }
        .tool-group:last-child { border-right: none; }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #444;
            color: white;
        }
        button.active { background: #2196F3; }
        input[type="color"] { width: 36px; height: 32px; cursor: pointer; border: none; }
        input[type="number"] { width: 60px; padding: 4px; }
        label { font-size: 13px; margin-right: 4px; }

        /* Canvas铺满屏幕 */
        #canvasWrap { flex: 1; position: relative; }
        #drawCanvas {
            display: block;
            background: #ffffff;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <!-- 绘图工具切换 -->
        <div class="tool-group">
            <button data-tool="pen" class="active">画笔</button>
            <button data-tool="line">直线</button>
            <button data-tool="rect">矩形</button>
            <button data-tool="circle">正圆</button>
            <button data-tool="ellipse">椭圆</button>
            <button data-tool="text">文字</button>
        </div>

        <!-- 颜色与线条粗细 -->
        <div class="tool-group">
            <label>颜色:</label>
            <input type="color" id="strokeColor" value="#000000">
            <label>线宽:</label>
            <input type="number" id="lineWidth" min="1" max="50" value="3">
        </div>

        <!-- 操作按钮 -->
        <div class="tool-group">
            <button id="undoBtn">撤销</button>
            <button id="clearBtn">清空画布</button>
        </div>
    </div>

    <div id="canvasWrap">
        <canvas id="drawCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrap = document.getElementById('canvasWrap');

        // 全局状态
        let currentTool = 'pen';
        let strokeColor = '#000000';
        let lineWidth = 3;
        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        // 图形历史栈（矢量数据，保证放大不失真）
        let shapeHistory = [];
        // 临时绘制缓存（鼠标拖拽预览）
        let tempShape = null;

        // 工具按钮绑定
        document.querySelectorAll('[data-tool]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
            };
        });

        // 颜色、线宽监听
        document.getElementById('strokeColor').oninput = e => strokeColor = e.target.value;
        document.getElementById('lineWidth').oninput = e => lineWidth = Number(e.target.value);

        // 撤销、清空
        document.getElementById('undoBtn').onclick = () => {
            if (shapeHistory.length) shapeHistory.pop();
            renderAll();
        };
        document.getElementById('clearBtn').onclick = () => {
            shapeHistory = [];
            renderAll();
        };

        // 自适应画布大小（铺满浏览器可视区域）
        function resizeCanvas() {
            canvas.width = canvasWrap.clientWidth;
            canvas.height = canvasWrap.clientHeight;
            renderAll();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 鼠标坐标转换
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        // 鼠标按下
        canvas.onmousedown = e => {
            isDrawing = true;
            const pos = getPos(e);
            startX = pos.x;
            startY = pos.y;
            currentX = pos.x;
            currentY = pos.y;

            if (currentTool === 'pen') {
                tempShape = {
                    type: 'pen',
                    color: strokeColor,
                    width: lineWidth,
                    points: [{x: startX, y: startY}]
                };
            } else if (currentTool === 'text') {
                // 文字工具直接弹窗输入
                const text = prompt('输入文字内容：', '示例文字');
                if (text) {
                    shapeHistory.push({
                        type: 'text',
                        x: startX,
                        y: startY,
                        color: strokeColor,
                        size: lineWidth * 8,
                        content: text
                    });
                    renderAll();
                }
                isDrawing = false;
            } else {
                tempShape = {
                    type: currentTool,
                    color: strokeColor,
                    width: lineWidth,
                    x1: startX,
                    y1: startY,
                    x2: startX,
                    y2: startY
                };
            }
        };

        // 鼠标移动
        canvas.onmousemove = e => {
            if (!isDrawing || !tempShape) return;
            const pos = getPos(e);
            currentX = pos.x;
            currentY = pos.y;

            if (tempShape.type === 'pen') {
                tempShape.points.push({x: currentX, y: currentY});
            } else {
                tempShape.x2 = currentX;
                tempShape.y2 = currentY;
            }
            renderAll();
        };

        // 鼠标松开
        canvas.onmouseup = canvas.onmouseleave = () => {
            if (!isDrawing || !tempShape) return;
            isDrawing = false;
            shapeHistory.push(JSON.parse(JSON.stringify(tempShape)));
            tempShape = null;
            renderAll();
        };

        // 全局渲染：绘制历史图形 + 临时预览图形
        function renderAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 绘制历史矢量图形
            shapeHistory.forEach(shape => drawSingleShape(shape));
            // 绘制临时拖拽预览
            if (tempShape) drawSingleShape(tempShape);
        }

        // 绘制单个矢量图形
        function drawSingleShape(shape) {
            ctx.strokeStyle = shape.color;
            ctx.lineWidth = shape.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            switch (shape.type) {
                case 'pen':
                    if (shape.points.length < 2) return;
                    ctx.beginPath();
                    ctx.moveTo(shape.points[0].x, shape.points[0].y);
                    for (let i = 1; i < shape.points.length; i++) {
                        ctx.lineTo(shape.points[i].x, shape.points[i].y);
                    }
                    ctx.stroke();
                    break;

                case 'line':
                    ctx.beginPath();
                    ctx.moveTo(shape.x1, shape.y1);
                    ctx.lineTo(shape.x2, shape.y2);
                    ctx.stroke();
                    break;

                case 'rect':
                    const rx = Math.min(shape.x1, shape.x2);
                    const ry = Math.min(shape.y1, shape.y2);
                    const rw = Math.abs(shape.x2 - shape.x1);
                    const rh = Math.abs(shape.y2 - shape.y1);
                    ctx.beginPath();
                    ctx.rect(rx, ry, rw, rh);
                    ctx.stroke();
                    break;

                case 'circle':
                    const cr = Math.hypot(shape.x2 - shape.x1, shape.y2 - shape.y1);
                    ctx.beginPath();
                    ctx.arc(shape.x1, shape.y1, cr, 0, Math.PI * 2);
                    ctx.stroke();
                    break;

                case 'ellipse':
                    const ex = shape.x1;
                    const ey = shape.y1;
                    const erx = Math.abs(shape.x2 - shape.x1);
                    const ery = Math.abs(shape.y2 - shape.y1);
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, erx, ery, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    break;

                case 'text':
                    ctx.fillStyle = shape.color;
                    ctx.font = `${shape.size}px sans-serif`;
                    ctx.fillText(shape.content, shape.x, shape.y);
                    break;
            }
        }
    </script>
</body>
</html>
